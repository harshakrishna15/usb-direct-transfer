[package]
name = "usb-direct-transfer"
version = "0.1.0"
edition = "2024"
default-run = "usb-transfer"

[[bin]]
name = "usb-transfer"
path = "src/bin/usb-transfer.rs"

[[bin]]
name = "usb-transfer-gui"
path = "src/bin/usb-transfer-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:indexmap", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"], optional = true }
filetime = "0.2"
fs2 = "0.4"
indexmap = { version = "2", optional = true }
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rfd = { version = "0.15", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }
